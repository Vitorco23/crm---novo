name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # package.json and the current Lovable-generated lockfile are temporarily
      # out of sync. npm install keeps CI useful without altering the repository.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check core types
        run: npm run typecheck:strict

      - name: Lint core modules
        run: npm run lint:core

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
